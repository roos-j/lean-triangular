# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# This file was drafted by Claude and human-edited.
version: "v0.4"

project:
  name: "Formalization of bounds for the triangular Hilbert transform and Carleson's theorem"
  description: >-
    This is a Lean 4 formalization of L^3 bounds for the triangular Hilbert
    form, following a streamlined version of an OpenAI manuscript.
    This also gives a proof of Carleson's theorem on pointwise convergence of Fourier series,
    which is also part of this formalization.
    Theorem statements are human-written, while the proof was automatically generated by coding agents.
  authors:
    - "Joris Roos"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Joris Roos"

classification:
  arxiv: ["math.CA"]
  msc2020: ["42B20", "42A20"]

sources:
  - title: "The maximal triangular Hilbert transform at the symmetric point"
    authors:
      - "OpenAI"
    id: "OpenAI Math Release preprint, 2026, https://github.com/openai/math/blob/adc7f1241b42e322a6451854ab7e4b4c146bf78a/preprints/The-maximal-triangular-Hilbert-transform-at-the-symmetric-point-September-24-2026/paper.pdf"
    type: paper
    location: "Theorem 1.1, Corollary 7.3 and Proposition 7.4"
    relationship: adapts
    note: >-
      The manuscript is attributed to OpenAI and, according to the openai/math repository, was
      produced by an internal OpenAI model. Its main result (Theorem 1.1) is the pointwise
      maximal L^3 x L^3 -> L^(3/2) estimate for the bilinear triangular Hilbert transform. The
      formalization proves the weaker scalar consequence in the simplex coordinates of
      Proposition 7.4: existence of the symmetric principal value and a uniform L^3 bound for
      Schwartz inputs. The proof follows a streamlined version of the argument, recorded in
      automation/instructions.md, which keeps the matrix energy, cyclic trace inequality and
      Gaussian heat dissipation but omits the output-dependent truncations and energy jump
      estimates of Sections 5 and 6, which are needed only for the maximal estimate.
    author_endorsement: "n/a"
  - title: "On convergence and growth of partial sums of Fourier series"
    authors:
      - "Lennart Carleson"
    id: "Acta Math. 116 (1966), 135-157, doi:10.1007/BF02392815"
    type: paper
    location: "Main theorem (almost everywhere convergence of Fourier series)"
    relationship: independently-proves
    note: >-
      Carleson's theorem is proved here only for continuous 1-periodic functions, by deducing a
      linearized maximal estimate for Fourier partial sums from the triangular Hilbert form
      bound (Triangular/Auto/Carleson.lean), not along Carleson's original argument.

related_formalizations:
  - id: "https://github.com/openai/math/tree/4eaee87548250b2682affda7d05d947c05554bae/lean/OAI/Analysis/TriangularHilbert"
    relationship: independent
    note: >-
      OpenAI's Lean formalization accompanying the source manuscript, with Comparator challenge
      OAI.TriangularHilbert.main_estimate in lean/ComparatorChallenges/TriangularHilbert.lean.
      It formalizes the full pointwise maximal L^3 x L^3 -> L^(3/2) estimate of Theorem 1.1 for
      general L^3 inputs, which is stronger than the scalar Schwartz bound compared here. The
      present formalization was developed independently and does not import it.
  - id: "https://github.com/fpvandoorn/carleson"
    relationship: independent
    note: >-
      The Carleson project formalizes Carleson's theorem for all L^2 periodic functions (and a
      metric space generalization) along a different line of argument. The present
      formalization is independent of it and does not import it.
  - id: "https://github.com/roos-j/lean-lt-carleson"
    relationship: independent
    note: >-
      Formalizes Carleson's theorem via the Lacey-Thiele method. Not imported here.
  - id: "https://github.com/roos-j/lean-trilinearht"
    relationship: other
    note: >-
      Formalization of a bound for the trilinear Hilbert transform. A few dense extension helper
      lemmas were adapted from it, with attribution recorded in automation/instructions.md; it
      is not a dependency.

status:
  scope: >-
    Formalized and compared: Triangular.triangular_ht_bound, an a priori uniform bound
    |T(F0, F1, F2)| <= C ||F0||_3 ||F1||_3 ||F2||_3 for Schwartz functions on R^2, where T is the
    symmetric principal value (lower truncation epsilon -> 0, no upper truncation) of the
    simplex form; and Triangular.classical_carleson, almost everywhere convergence of the
    symmetric Fourier partial sums of a continuous 1-periodic function. Proved in the
    development but not compared: existence of the principal value for Schwartz inputs
    (Auto.tendsto_T_trunc) and the unique bounded trilinear extension to L^3(R^2)
    (Auto.triangularHilbert_unique_extension). Not formalized: the maximal estimate and the
    bilinear L^(3/2) bounds of Theorem 1.1 and Theorem 7.2 of the source, general L^3 inputs
    and two-sided truncations, and Carleson's theorem beyond continuous functions.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: agent
      models: ["GPT-6 Astra Light", "GPT-6 Astra Medium"]
      framework: "Codex"
      tool_setup: >-
        Codex running an autoformalization skill with Lean 4, Lake and Mathlib. The agent wrote
        the proof development in Triangular/Auto/TriangularHT.lean from a TeX blueprint of a
        streamlined version of the source proof, with human prompts setting targets and
        conventions.
      cost:
        wall_time: "a few hours"
        spend_usd: "not tracked"
        hardware: "local machine, API-only model access"
    - method: agent
      models: ["Claude Opus 5.5"]
      framework: "Claude Code"
      tool_setup: >-
        Claude Code with Lean 4, Lake and Mathlib. The agent wrote the deduction of Carleson's
        theorem in Triangular/Auto/Carleson.lean, wrote bridge lemmas, and
        prepared the Palomar submission files.
      cost:
        wall_time: "several hours"
        spend_usd: "not tracked"
        hardware: "local machine, API-only model access"

fidelity:
  divergences: >-
    (1) The compared triangular result is the scalar simplex-form bound, weaker than the
    pointwise maximal bilinear estimate of Theorem 1.1 of the source: only the lower truncation
    is used, the bound is stated a priori for Schwartz functions, and the bound is expressed with
    extended nonnegative reals and Mathlib's eLpNorm. (2) T is defined with limUnder, so it is
    meaningful only where the principal value exists; existence for Schwartz inputs is proved
    (Auto.tendsto_T_trunc) but is not part of the compared surface. (3) The proof is a
    streamlined version of the source argument and does not follow Sections 5 and 6; a Gaussian
    variance differs from the blueprint, which changes only the unspecified constant (see
    automation/ErrorReport.md). (4) Carleson's theorem is stated only for continuous 1-periodic
    functions, with symmetric partial sums built from Mathlib's fourierCoeffOn on [0, 1].

review:
  status: "self-assessed"
  reviewers:
    - "Joris Roos"
  notes: >-
    The statements in Triangular/Theorems.lean and the definitions in Triangular/Defs.lean
    have the intended mathematical meaning. The proofs are checked by
    the Lean kernel; the proof development has not been reviewed line by line by a human.

alignment:
  namespace: "Triangular"
  statements:
    - source: "OpenAI manuscript, Proposition 7.4 (scalar simplex form), consequence of Theorem 1.1"
      lean: "Triangular.triangular_ht_bound"
      module: "Triangular.Theorems"
      status: adapted
      note: >-
        Uniform L^3 bound for the symmetric principal value of the simplex form on Schwartz
        functions, with the qualifications listed under fidelity.divergences.
    - source: "Carleson, Acta Math. 116 (1966), main theorem"
      lean: "Triangular.classical_carleson"
      module: "Triangular.Theorems"
      status: adapted
      note: >-
        Almost everywhere convergence of the symmetric Fourier partial sums for continuous
        1-periodic functions only.

acknowledgements: "Mathlib and the Lean community."
